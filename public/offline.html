<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a4eac" />
    <title>Offline — Converge</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(
          125% 125% at 22% 14%,
          #4a6fcf 0%,
          #2a4eac 60%,
          #1f3f97 100%
        );
        color: #eaf0ff;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22%;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #c3d0f2;
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font: inherit;
        font-weight: 500;
        padding: 0.6rem 1.4rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="Converge" />
      <h1>You're offline</h1>
      <p>
        Converge can't reach the network right now. Check your connection and
        try again — your data is waiting.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
